<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnyxPick | Dispatch</title>
    <style>
        :root { 
            --onyx: #111111; 
            --white: #ffffff; 
            --bus-yellow: #FFD500;
            --alert-red: #FF4444;
            --go-green: #00E676;
            --border: 4px solid var(--onyx);
            --shadow: 6px 6px 0px var(--onyx);
        }
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; outline: none; }
        body, html { margin: 0; padding: 0; background: var(--white); color: var(--onyx); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Typography & Components */
        h1, h2, h3 { font-weight: 900; text-transform: uppercase; margin: 0; }
        .btn { 
            background: var(--white); color: var(--onyx); border: var(--border); padding: 15px 20px; 
            font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; 
            box-shadow: var(--shadow); transition: transform 0.1s, box-shadow 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--onyx); }
        .btn.yellow { background: var(--bus-yellow); }
        .btn.black { background: var(--onyx); color: var(--white); }
        .btn.red { background: var(--alert-red); color: var(--white); }
        .btn.green { background: var(--go-green); color: var(--onyx); }

        input { 
            width: 100%; padding: 15px; border: var(--border); margin-bottom: 15px; 
            font-weight: 800; font-size: 1.2rem; 
        }

        /* Screens */
        .screen { display: none; height: 100%; width: 100%; flex-direction: column; }
        .active-screen { display: flex; }
        .center-box { margin: auto; border: var(--border); padding: 40px; box-shadow: var(--shadow); width: 90%; max-width: 450px; background: var(--white); text-align: center; }

        /* Animated Onyx Logo */
        .logo-container { width: 80px; height: 80px; margin: 0 auto 20px auto; position: relative; perspective: 1000px; }
        .onyx-gem { 
            width: 100%; height: 100%; background: var(--onyx); border: 4px solid var(--bus-yellow);
            transform: rotate(45deg); animation: pulseGem 2s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(255, 213, 0, 0.5);
        }
        @keyframes pulseGem {
            0% { transform: rotate(45deg) scale(1); }
            50% { transform: rotate(45deg) scale(1.1); }
            100% { transform: rotate(45deg) scale(1); }
        }

        /* Header */
        .header { padding: 20px; border-bottom: var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bus-yellow); }
        
        /* Modals & Overlays */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; }

        /* Voice Button */
        .voice-btn {
            width: 100px; height: 100px; border-radius: 50%; background: var(--alert-red); 
            border: var(--border); box-shadow: var(--shadow); cursor: pointer;
            display: flex; align-items: center; justify-content: center; margin: 30px auto;
            transition: all 0.2s; user-select: none; -webkit-user-select: none;
        }
        .voice-btn:active, .voice-btn.recording { transform: scale(0.9); box-shadow: 0 0 0 var(--onyx); background: var(--onyx); color: var(--white); }

        /* Receiver List */
        .list-container { flex: 1; overflow-y: auto; padding: 20px; background: #f4f4f4; }
        .student-card { 
            background: var(--white); border: var(--border); padding: 20px; margin-bottom: 15px; 
            box-shadow: 4px 4px 0 var(--onyx); display: flex; justify-content: space-between; align-items: center; 
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .student-name { font-size: 1.5rem; font-weight: 900; }
        .dismiss-btn { background: var(--onyx); color: var(--white); border: none; padding: 10px 15px; font-weight: 900; cursor: pointer; }

        /* Time Warning Bar */
        #time-warning { background: var(--alert-red); color: var(--white); font-weight: 900; text-align: center; padding: 10px; display: none; border-bottom: var(--border); }
    </style>
</head>
<body>

    <!-- TIME WARNING -->
    <div id="time-warning">NOTICE: OUTSIDE NORMAL PICKUP HOURS (1 PM - 5 PM)</div>

    <!-- PROFILE SCREEN -->
    <div id="profile-screen" class="screen active-screen" style="justify-content: center; background: #f4f4f4;">
        <div class="center-box">
            <div class="logo-container"><div class="onyx-gem"></div></div>
            <h1 style="margin-bottom: 20px;">ONYXPICK</h1>
            <input type="text" id="teacher-name" placeholder="YOUR NAME (E.G. MR. SMITH)">
            <button class="btn yellow" style="width: 100%;" onclick="saveProfile()">JOIN NETWORK</button>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen">
        <div class="header">
            <h2 style="font-size: 1.2rem;">ONYXPICK // <span id="dash-user">USER</span></h2>
            <button class="btn black" style="padding: 5px 10px; font-size: 0.8rem;" onclick="logout()">SWITCH</button>
        </div>
        <div class="center-box" style="box-shadow: none; border: none; background: transparent;">
            <div style="border: var(--border); padding: 20px; background: var(--white); box-shadow: var(--shadow); margin-bottom: 30px;">
                <h3 style="color: #666; font-size: 1rem;">TODAY'S DATE</h3>
                <h1 id="dash-date" style="font-size: 2rem;">--</h1>
            </div>
            <button class="btn yellow" style="width: 100%; height: 80px; margin-bottom: 20px;" onclick="showScreen('caller-screen'); focusInput();">
                🎤 CALLER (ENTRANCE)
            </button>
            <button class="btn black" style="width: 100%; height: 80px;" onclick="startReceiver()">
                📋 RECEIVER (INSIDE)
            </button>
        </div>
    </div>

    <!-- CALLER SCREEN -->
    <div id="caller-screen" class="screen">
        <div class="header" style="background: var(--onyx); color: var(--white);">
            <h2>CALLER STATION</h2>
            <button class="btn white" style="padding: 5px 10px; font-size: 0.8rem;" onclick="showScreen('dashboard-screen')">BACK</button>
        </div>
        <div style="padding: 20px; text-align: center; display: flex; flex-direction: column; flex: 1; justify-content: center;">
            <input type="text" id="manual-name" placeholder="TYPE STUDENT NAME..." style="font-size: 1.5rem; text-align: center;" onkeypress="if(event.key === 'Enter') submitManualName()">
            <button class="btn yellow" style="width: 100%; margin-bottom: 30px;" onclick="submitManualName()">SEND PING</button>
            
            <h3 style="color: #666;">OR HOLD TO SPEAK</h3>
            <div id="mic-btn" class="voice-btn">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </div>
            <p id="mic-status" style="font-weight: 800;">READY</p>
        </div>
    </div>

    <!-- RECEIVER SCREEN -->
    <div id="receiver-screen" class="screen">
        <div class="header">
            <h2>RECEIVER STATION</h2>
            <button class="btn black" style="padding: 5px 10px; font-size: 0.8rem;" onclick="showScreen('dashboard-screen')">BACK</button>
        </div>
        <div style="padding: 20px; background: var(--white); border-bottom: var(--border);">
            <input type="text" id="search-bar" placeholder="SEARCH FOR STUDENT..." style="margin: 0;" onkeyup="filterList()">
        </div>
        <div id="receiver-list" class="list-container">
            <!-- Names appear here -->
        </div>
    </div>

    <!-- AI CONFIRMATION MODAL -->
    <div id="confirm-modal" class="overlay">
        <div class="center-box" style="background: var(--bus-yellow);">
            <h3 style="margin-bottom: 10px;">DID YOU SAY:</h3>
            <h1 id="ai-heard-name" style="font-size: 2.5rem; margin-bottom: 20px; background: var(--white); padding: 10px; border: var(--border);">NAME</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn green" style="flex: 1;" onclick="confirmVoiceSend()">YES, SEND</button>
                <button class="btn red" onclick="closeModal()">REJECT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. !!! INSERT FIREBASE CONFIG !!!
const firebaseConfig = {
  apiKey: "AIzaSyBH6B0rJhAVC_LqAH8p02SwWLgsGYdjtNo",
  authDomain: "northhill-pickup.firebaseapp.com",
  projectId: "northhill-pickup",
  storageBucket: "northhill-pickup.firebasestorage.app",
  messagingSenderId: "232967656089",
  appId: "1:232967656089:web:4ab8681b513bfe61c5de08",
  measurementId: "G-NBSRC1YX65"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. !!! INSERT GEMINI API KEY !!!
        const GEMINI_API_KEY = "AIzaSyBP2bRDuC3EWY-Cnkj9o31LYpSDK-g6HAY";

        // Global Variables
        let currentUser = localStorage.getItem('onyx_profile');
        let todayString = new Date().toISOString().split('T')[0];
        let audioRecorder;
        let audioChunks = [];
        let isRecording = false;
        let pendingAIVoiceName = "";

        // --- INIT & LOGIC ---
        window.onload = () => {
            checkTime();
            document.getElementById('dash-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            if (currentUser) {
                document.getElementById('dash-user').innerText = currentUser;
                showScreen('dashboard-screen');
            }
        };

        function checkTime() {
            const hour = new Date().getHours();
            // Shows warning if before 13:00 (1 PM) or after 17:00 (5 PM)
            if (hour < 13 || hour >= 17) {
                document.getElementById('time-warning').style.display = 'block';
            }
        }

        window.saveProfile = () => {
            const name = document.getElementById('teacher-name').value.trim();
            if (!name) return alert("Please enter your name.");
            localStorage.setItem('onyx_profile', name);
            currentUser = name;
            document.getElementById('dash-user').innerText = currentUser;
            showScreen('dashboard-screen');
        };

        window.logout = () => {
            localStorage.removeItem('onyx_profile');
            currentUser = null;
            showScreen('profile-screen');
        };

        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        };

        window.focusInput = () => {
            setTimeout(() => document.getElementById('manual-name').focus(), 100);
        };

        // --- CALLER: MANUAL TEXT ---
        window.submitManualName = async () => {
            const input = document.getElementById('manual-name');
            const name = input.value.trim();
            if (!name) return;

            await addDoc(collection(db, "onyx_pickups"), {
                studentName: name.toUpperCase(),
                caller: currentUser,
                date: todayString,
                status: "waiting",
                timestamp: serverTimestamp()
            });

            input.value = '';
            input.focus(); // Auto-prompt loop
        };

        // --- CALLER: GEMINI VOICE LOGIC ---
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('mic-status');

        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('touchstart', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('touchend', stopRecording);

        async function startRecording(e) {
            e.preventDefault();
            if (isRecording) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                audioRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                audioRecorder.onstop = processAudio;
                
                audioRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                statusText.innerText = "LISTENING...";
            } catch (err) {
                alert("Microphone access denied or unavailable.");
            }
        }

        function stopRecording(e) {
            e.preventDefault();
            if (!isRecording) return;
            audioRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            statusText.innerText = "PROCESSING WITH AI...";
        }

        async function processAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Listen to this audio. It is a teacher calling a student's name for school pickup. Extract the student's name. Reply ONLY with the exact name, nothing else." },
                                    { inlineData: { mimeType: "audio/webm", data: base64Audio } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    if(data.candidates && data.candidates[0]) {
                        pendingAIVoiceName = data.candidates[0].content.parts[0].text.trim().toUpperCase();
                        document.getElementById('ai-heard-name').innerText = pendingAIVoiceName;
                        document.getElementById('confirm-modal').style.display = 'flex';
                    } else {
                        alert("AI couldn't understand. Please try again.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("AI Connection Failed.");
                }
                statusText.innerText = "READY";
            };
        }

        window.confirmVoiceSend = async () => {
            if(!pendingAIVoiceName) return;
            await addDoc(collection(db, "onyx_pickups"), {
                studentName: pendingAIVoiceName,
                caller: currentUser,
                date: todayString,
                status: "waiting",
                timestamp: serverTimestamp()
            });
            closeModal();
            pendingAIVoiceName = "";
        };

        window.closeModal = () => { document.getElementById('confirm-modal').style.display = 'none'; };

        // --- RECEIVER LOGIC & PING SOUND ---
        let initialLoad = true;

        window.startReceiver = () => {
            showScreen('receiver-screen');
            initialLoad = true; // Prevent playing ping for old messages on first load

            const q = query(
                collection(db, "onyx_pickups"), 
                where("date", "==", todayString),
                where("status", "==", "waiting"),
                orderBy("timestamp", "desc")
            );

            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('receiver-list');
                list.innerHTML = '';

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !initialLoad) {
                        playPing();
                    }
                });

                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    list.innerHTML += `
                        <div class="student-card" data-name="${d.studentName}">
                            <div>
                                <div class="student-name">${d.studentName}</div>
                                <div style="font-size:0.8rem; font-weight:700; color:#666;">CALLED BY: ${d.caller}</div>
                            </div>
                            <button class="dismiss-btn" onclick="dismissStudent('${docSnap.id}')">DONE</button>
                        </div>
                    `;
                });
                
                filterList(); // Re-apply search filter if active
                initialLoad = false;
            });
        };

        window.dismissStudent = async (docId) => {
            await updateDoc(doc(db, "onyx_pickups", docId), { status: "picked_up" });
        };

        window.filterList = () => {
            const search = document.getElementById('search-bar').value.toUpperCase();
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                if (card.dataset.name.includes(search)) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        };

        // Web Audio API for the Ping sound
        function playPing() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // High pitch beep (A5)
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1); 
                
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) { console.log("Audio play blocked by browser policy."); }
        }
    </script>
</body>
</html>
